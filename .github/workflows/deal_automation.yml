name: Deal Automation Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        run: |
          python main.py

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Commit and Push Posted Deals History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posted_deals.txt history [skip ci]"
          file_pattern: "posted_deals.txt"
